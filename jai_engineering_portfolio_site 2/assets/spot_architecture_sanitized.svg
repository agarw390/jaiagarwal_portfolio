<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320">
  <rect width="100%" height="100%" fill="#f8f8f6"/>
  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f28c28" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
    <marker id="arrowBlueDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
    <style>
      .box { fill:#fff; stroke:#111; stroke-width:3; rx:8; ry:8; }
      .title { font: 700 32px Arial, sans-serif; fill:#111827; }
      .boxtitle { font: 700 20px Arial, sans-serif; fill:#111; }
      .small { font: 400 16px Arial, sans-serif; fill:#374151; }
      .legend { font: 600 18px Arial, sans-serif; fill:#111827; }
    </style>
  </defs>
  <text x="50" y="60" class="title">Sanitized Payload Power + Data Architecture</text>

  <rect x="930" y="45" width="220" height="115" class="box" fill="#fff"/>
  <line x1="955" y1="82" x2="1035" y2="82" stroke="#f28c28" stroke-width="4" marker-end="url(#arrowOrange)" />
  <text x="1050" y="88" class="legend">Power</text>
  <line x1="955" y1="112" x2="1035" y2="112" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)" />
  <text x="1050" y="118" class="legend">Data</text>
  <line x1="955" y1="142" x2="1035" y2="142" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrowBlueDash)" />
  <text x="1050" y="148" class="legend">Wireless link</text>

  <!-- Top -->
  <rect x="360" y="95" width="350" height="105" class="box"/>
  <text x="535" y="138" text-anchor="middle" class="boxtitle">Spot Payload Port</text>
  <text x="535" y="168" text-anchor="middle" class="small">35–58.8V Unregulated DC</text>
  <text x="535" y="190" text-anchor="middle" class="small">150 W max</text>

  <line x1="535" y1="200" x2="535" y2="270" stroke="#f28c28" stroke-width="5" marker-end="url(#arrowOrange)"/>

  <rect x="300" y="275" width="470" height="95" class="box"/>
  <text x="535" y="333" text-anchor="middle" class="boxtitle">DC-DC Converter</text>

  <line x1="535" y1="370" x2="535" y2="435" stroke="#f28c28" stroke-width="5" marker-end="url(#arrowOrange)"/>

  <rect x="405" y="440" width="260" height="78" class="box"/>
  <text x="535" y="488" text-anchor="middle" class="boxtitle">Power Switch</text>

  <!-- power bus -->
  <path d="M 535 518 L 535 585 L 140 585 L 140 635" fill="none" stroke="#f28c28" stroke-width="5" marker-end="url(#arrowOrange)"/>
  <path d="M 535 518 L 535 610 L 345 610 L 345 635" fill="none" stroke="#f28c28" stroke-width="5" marker-end="url(#arrowOrange)"/>
  <path d="M 535 518 L 535 610 L 555 610 L 555 635" fill="none" stroke="#f28c28" stroke-width="5" marker-end="url(#arrowOrange)"/>
  <path d="M 535 518 L 535 610 L 765 610 L 765 635" fill="none" stroke="#f28c28" stroke-width="5" marker-end="url(#arrowOrange)"/>
  <path d="M 535 518 L 535 735" fill="none" stroke="#f28c28" stroke-width="5" marker-end="url(#arrowOrange)"/>

  <rect x="40" y="640" width="200" height="105" class="box"/>
  <text x="140" y="700" text-anchor="middle" class="boxtitle">GPS / INS</text>

  <rect x="245" y="640" width="200" height="105" class="box"/>
  <text x="345" y="700" text-anchor="middle" class="boxtitle">EO Stereo Cameras</text>

  <rect x="455" y="640" width="200" height="105" class="box"/>
  <text x="555" y="700" text-anchor="middle" class="boxtitle">Thermal Cameras</text>

  <rect x="665" y="640" width="200" height="105" class="box"/>
  <text x="765" y="700" text-anchor="middle" class="boxtitle">Fans (x2)</text>

  <!-- compute -->
  <rect x="330" y="760" width="410" height="120" class="box"/>
  <text x="535" y="828" text-anchor="middle" class="boxtitle">Onboard Compute</text>

  <!-- data arrows -->
  <line x1="140" y1="745" x2="140" y2="800" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M 140 800 L 450 800" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>

  <line x1="345" y1="745" x2="345" y2="780" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M 345 780 L 470 780" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>

  <line x1="555" y1="745" x2="555" y2="760" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>

  <!-- radio -->
  <line x1="535" y1="880" x2="535" y2="950" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <rect x="400" y="960" width="270" height="85" class="box"/>
  <text x="535" y="1012" text-anchor="middle" class="boxtitle">Radio</text>

  <line x1="535" y1="1045" x2="535" y2="1130" stroke="#2563eb" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrowBlueDash)"/>

  <rect x="315" y="1140" width="440" height="92" class="box"/>
  <text x="535" y="1196" text-anchor="middle" class="boxtitle">Operator Station</text>
</svg>